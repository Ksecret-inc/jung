<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매출 대시보드 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
  --accent: #2f6fde; --accent-soft: #e6eefc; --chip: #f1f3f6;
  --c1: #2f6fde; --c2: #e07b39; --c3: #2a9d8f; --c4: #c2477a; --c5: #8a6bd1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #9aa3b2; --line: #2b313c;
    --accent: #6c9bf0; --accent-soft: #24324a; --chip: #252b36;
    --c1: #6c9bf0; --c2: #f0a06b; --c3: #4fc2b3; --c4: #e57aa6; --c5: #ab93e8;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b2029; --text: #e8ebf0; --muted: #9aa3b2; --line: #2b313c;
  --accent: #6c9bf0; --accent-soft: #24324a; --chip: #252b36;
  --c1: #6c9bf0; --c2: #f0a06b; --c3: #4fc2b3; --c4: #e57aa6; --c5: #ab93e8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; }
.sub { color: var(--muted); margin-top: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
.reset { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
.reset:hover { border-color: var(--accent); color: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.filters { display: grid; gap: 10px; margin-bottom: 16px; }
.frow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters > .frow { flex-wrap: nowrap; align-items: flex-start; }
.filters > .frow > .flabel { padding-top: 5px; }
.filters > .frow > .frow { flex: 1; min-width: 0; }
.flabel { width: 40px; color: var(--muted); font-weight: 500; flex-shrink: 0; }
.chip { border: 1px solid transparent; background: var(--chip); border-radius: 999px; padding: 5px 12px; font-size: 13px; }
.chip:hover { border-color: var(--line); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 500; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.kpi .k { color: var(--muted); font-size: 13px; }
.kpi .v { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .n { color: var(--muted); font-size: 12px; margin-top: 4px; }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
h2 { font-size: 15px; margin: 0 0 4px; }
.hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.chart { position: relative; height: 280px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 13px; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--accent); }
.scroll { overflow-x: auto; }
.heat td.cell { cursor: pointer; }
.heat td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
.detail { max-height: 420px; overflow: auto; }
.detail thead th { position: sticky; top: 0; background: var(--card); }
.empty { color: var(--muted); text-align: center; padding: 24px; }
@media (max-width: 900px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .grid, .grid2 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>매출 대시보드 2026</h1>
      <div class="sub">[교육용 더미] 매출 데이터 · 2026-01 ~ 2026-10 · 칩이나 차트를 클릭해 필터링</div>
    </div>
    <button class="reset" id="reset">필터 초기화</button>
  </header>

  <div class="card filters">
    <div class="frow"><span class="flabel">월</span><div class="frow" id="f-month"></div></div>
    <div class="frow"><span class="flabel">제품</span><div class="frow" id="f-product"></div></div>
    <div class="frow"><span class="flabel">채널</span><div class="frow" id="f-channel"></div></div>
  </div>

  <div class="kpis">
    <div class="card kpi"><div class="k">총 매출</div><div class="v" id="k-rev"></div><div class="n" id="k-rev-n"></div></div>
    <div class="card kpi"><div class="k">판매수량</div><div class="v" id="k-qty"></div><div class="n" id="k-qty-n"></div></div>
    <div class="card kpi"><div class="k">평균 판매단가</div><div class="v" id="k-asp"></div><div class="n">매출 ÷ 판매수량</div></div>
    <div class="card kpi"><div class="k">평균 할인율</div><div class="v" id="k-disc"></div><div class="n">정가 대비 할인 금액 비중</div></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>월별 매출</h2><div class="hint">채널별 누적 · 막대를 클릭하면 해당 월 선택</div>
      <div class="chart"><canvas id="ch-month"></canvas></div>
    </div>
    <div class="card">
      <h2>채널별 매출</h2><div class="hint">막대를 클릭하면 해당 채널 선택</div>
      <div class="chart"><canvas id="ch-channel"></canvas></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card">
      <h2>제품별 매출</h2><div class="hint">막대를 클릭하면 해당 제품 선택</div>
      <div class="chart"><canvas id="ch-product"></canvas></div>
    </div>
    <div class="card">
      <h2>제품 × 채널 매출 (백만원)</h2><div class="hint">칸을 클릭하면 제품과 채널을 함께 선택</div>
      <div class="scroll"><table class="heat" id="heat"></table></div>
    </div>
  </div>

  <div class="card">
    <h2>상세 데이터</h2><div class="hint" id="detail-hint"></div>
    <div class="detail"><table id="detail"></table></div>
  </div>
</div>

const COLS = ["month", "product", "channel", "qty", "price", "disc", "rev"];
const data = ROWS.map(r => Object.fromEntries(COLS.map((c, i) => [c, r[i]])));
const uniq = k => [...new Set(data.map(d => d[k]))];
const MONTHS = uniq("month"), PRODUCTS = uniq("product"), CHANNELS = uniq("channel");
const sel = { month: new Set(), product: new Set(), channel: new Set() };

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const chColor = i => css("--c" + (i + 1));
const won = v => v.toLocaleString("ko-KR") + "원";
const eok = v => v >= 1e8 ? (v / 1e8).toFixed(2) + "억원" : (v / 1e4).toLocaleString("ko-KR", { maximumFractionDigits: 0 }) + "만원";
const mLabel = m => Number(m.slice(5)) + "월";

function pass(d, skip) {
  return ["month", "product", "channel"].every(k => k === skip || !sel[k].size || sel[k].has(d[k]));
}
function sum(rows, f) { return rows.reduce((a, d) => a + f(d), 0); }
function toggle(key, val) { sel[key].has(val) ? sel[key].delete(val) : sel[key].add(val); render(); }

function renderChips() {
  const groups = { month: [MONTHS, mLabel], product: [PRODUCTS, x => x], channel: [CHANNELS, x => x] };
  for (const [key, [vals, lab]] of Object.entries(groups)) {
    const box = document.getElementById("f-" + key);
    box.innerHTML = "";
    const all = document.createElement("button");
    all.className = "chip" + (sel[key].size ? "" : " on");
    all.textContent = "전체";
    all.onclick = () => { sel[key].clear(); render(); };
    box.appendChild(all);
    vals.forEach((v, i) => {
      const b = document.createElement("button");
      b.className = "chip" + (sel[key].has(v) ? " on" : "");
      b.innerHTML = (key === "channel" ? `<span class="dot" style="background:${chColor(i)}"></span>` : "") + lab(v);
      b.onclick = () => toggle(key, v);
      box.appendChild(b);
    });
  }
}

function renderKpis(rows) {
  const rev = sum(rows, d => d.rev), qty = sum(rows, d => d.qty), list = sum(rows, d => d.qty * d.price);
  document.getElementById("k-rev").textContent = eok(rev);
  document.getElementById("k-rev-n").textContent = won(rev);
  document.getElementById("k-qty").textContent = qty.toLocaleString("ko-KR") + "개";
  document.getElementById("k-qty-n").textContent = rows.length + "건";
  document.getElementById("k-asp").textContent = qty ? won(Math.round(rev / qty)) : "-";
  document.getElementById("k-disc").textContent = list ? ((1 - rev / list) * 100).toFixed(1) + "%" : "-";
}

const charts = {};
function baseOpts(onPick, horizontal) {
  const grid = css("--line"), tick = css("--muted");
  const valAxis = { grid: { color: grid }, ticks: { color: tick, callback: v => (v / 1e6).toLocaleString("ko-KR") + "M" } };
  const catAxis = { grid: { display: false }, ticks: { color: tick } };
  return {
    responsive: true, maintainAspectRatio: false, indexAxis: horizontal ? "y" : "x",
    animation: { duration: 250 },
    onClick: (e, els, chart) => { if (els.length) onPick(els[0].index); },
    onHover: (e, els) => { e.native.target.style.cursor = els.length ? "pointer" : "default"; },
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: c => `${c.dataset.label ? c.dataset.label + ": " : ""}${won(c.raw)}` } }
    },
    scales: horizontal ? { x: valAxis, y: catAxis } : { x: { ...catAxis, stacked: true }, y: { ...valAxis, stacked: true } }
  };
}
function upsert(id, cfg) {
  if (charts[id]) { charts[id].data = cfg.data; charts[id].options = cfg.options; charts[id].update(); }
  else charts[id] = new Chart(document.getElementById(id), cfg);
}
const dim = (color, on) => on ? color : color + "40";

function renderCharts() {
  // 월별: 다른 필터는 적용하고, 선택된 월은 진하게 표시
  const mRows = data.filter(d => pass(d, "month"));
  const opts = baseOpts(i => toggle("month", MONTHS[i]));
  opts.plugins.legend = { display: true, position: "bottom", labels: { color: css("--muted"), boxWidth: 10, boxHeight: 10 } };
  opts.plugins.tooltip.callbacks.footer = items => "합계: " + won(items.reduce((a, c) => a + c.raw, 0));
  opts.interaction = { mode: "index", intersect: false };
  upsert("ch-month", {
    type: "bar",
    data: {
      labels: MONTHS.map(mLabel),
      datasets: CHANNELS.map((c, ci) => ({
        label: c,
        data: MONTHS.map(m => sum(mRows.filter(d => d.month === m && d.channel === c), d => d.rev)),
        backgroundColor: MONTHS.map(m => dim(chColor(ci), !sel.month.size || sel.month.has(m))),
        borderRadius: 2
      }))
    },
    options: opts
  });

  const cRows = data.filter(d => pass(d, "channel"));
  upsert("ch-channel", {
    type: "bar",
    data: { labels: CHANNELS, datasets: [{
      data: CHANNELS.map(c => sum(cRows.filter(d => d.channel === c), d => d.rev)),
      backgroundColor: CHANNELS.map((c, i) => dim(chColor(i), !sel.channel.size || sel.channel.has(c))),
      borderRadius: 4 }] },
    options: baseOpts(i => toggle("channel", CHANNELS[i]), true)
  });

  const pRows = data.filter(d => pass(d, "product"));
  const acc = css("--accent");
  upsert("ch-product", {
    type: "bar",
    data: { labels: PRODUCTS, datasets: [{
      data: PRODUCTS.map(p => sum(pRows.filter(d => d.product === p), d => d.rev)),
      backgroundColor: PRODUCTS.map(p => dim(acc, !sel.product.size || sel.product.has(p))),
      borderRadius: 4 }] },
    options: baseOpts(i => toggle("product", PRODUCTS[i]), true)
  });
}

function renderHeat() {
  // 히트맵은 월 필터만 적용하고, 제품·채널 선택은 강조로 표시
  const base = data.filter(d => !sel.month.size || sel.month.has(d.month));
  const cell = (p, c) => sum(base.filter(d => d.product === p && d.channel === c), d => d.rev);
  const vals = PRODUCTS.flatMap(p => CHANNELS.map(c => cell(p, c)));
  const max = Math.max(...vals, 1);
  const acc = css("--accent");
  let h = "<thead><tr><th>제품</th>" + CHANNELS.map(c => `<th>${c}</th>`).join("") + "<th>합계</th></tr></thead><tbody>";
  PRODUCTS.forEach(p => {
    let tot = 0;
    h += `<tr><td>${p}</td>`;
    CHANNELS.forEach(c => {
      const v = cell(p, c); tot += v;
      const on = (!sel.product.size || sel.product.has(p)) && (!sel.channel.size || sel.channel.has(c));
      const a = Math.round((on ? 0.12 + 0.6 * v / max : 0.04) * 255).toString(16).padStart(2, "0");
      h += `<td class="cell" data-p="${p}" data-c="${c}" style="background:${acc}${a}">${(v / 1e6).toFixed(1)}</td>`;
    });
    h += `<td><b>${(tot / 1e6).toFixed(1)}</b></td></tr>`;
  });
  h += "</tbody>";
  const t = document.getElementById("heat");
  t.innerHTML = h;
  t.querySelectorAll("td.cell").forEach(td => td.onclick = () => {
    const p = td.dataset.p, c = td.dataset.c;
    const same = sel.product.size === 1 && sel.product.has(p) && sel.channel.size === 1 && sel.channel.has(c);
    sel.product.clear(); sel.channel.clear();
    if (!same) { sel.product.add(p); sel.channel.add(c); }
    render();
  });
}

let sortKey = "month", sortDir = 1;
function renderDetail(rows) {
  const cols = [["month", "월"], ["product", "제품"], ["channel", "채널"], ["qty", "판매수량"], ["price", "정가"], ["disc", "할인율"], ["rev", "매출"]];
  const sorted = [...rows].sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir);
  const fmt = (k, v) => k === "price" || k === "rev" ? v.toLocaleString("ko-KR") : k === "disc" ? v + "%" : k === "qty" ? v.toLocaleString("ko-KR") : v;
  let h = "<thead><tr>" + cols.map(([k, l], i) =>
    `<th class="sort" data-k="${k}" style="text-align:${i < 3 ? "left" : "right"}">${l}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("") + "</tr></thead><tbody>";
  h += sorted.length ? sorted.map(d => "<tr>" + cols.map(([k], i) =>
    `<td style="text-align:${i < 3 ? "left" : "right"}">${fmt(k, d[k])}</td>`).join("") + "</tr>").join("")
    : `<tr><td colspan="7" class="empty">선택한 조건에 맞는 데이터가 없습니다</td></tr>`;
  const t = document.getElementById("detail");
  t.innerHTML = h + "</tbody>";
  t.querySelectorAll("th.sort").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    sortDir = sortKey === k ? -sortDir : (["qty", "price", "disc", "rev"].includes(k) ? -1 : 1);
    sortKey = k; renderDetail(rows);
  });
  document.getElementById("detail-hint").textContent = `${rows.length}건 · 열 제목을 클릭하면 정렬`;
}

function render() {
  const rows = data.filter(d => pass(d));
  renderChips(); renderKpis(rows); renderCharts(); renderHeat(); renderDetail(rows);
}
document.getElementById("reset").onclick = () => { Object.values(sel).forEach(s => s.clear()); render(); };
Chart.defaults.font.family = '"Noto Sans KR", system-ui, sans-serif';
render();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
</script>
